# The heartbeat (design §Architecture).
#
# Retries any workout that generated or sent badly, then polls the mailbox for
# replies. Both are idempotent, so a run that overlaps or repeats costs
# nothing.
#
# GitHub Actions rather than Vercel Cron: the free Vercel tier limits how often
# a cron may run, and Actions on a public repository does not.
name: cron

on:
  schedule:
    # Every 15 minutes. Actions' floor is 5, but scheduled runs are queued
    # rather than punctual and often land late, so a tighter interval would buy
    # precision that does not exist.
    - cron: "*/15 * * * *"
  # So it can be run by hand from the Actions tab when something looks stuck.
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Call the cron endpoint
        run: |
          # Trailing slashes and http:// both produce a 308 that curl reports
          # as the outcome unless it is told to follow. The redirect is
          # harmless; a run should not go red over a formatting slip in a
          # secret. curl drops the auth header if a redirect ever crosses to
          # another host, so following is safe.
          target="${APP_URL%/}/api/cron"
          echo "calling $target"

          code=$(curl --silent --show-error --fail-with-body --location \
            --max-time 120 \
            --output /tmp/cron.json \
            --write-out '%{http_code}' \
            --request POST \
            --header "authorization: Bearer $CRON_SECRET" \
            "$target") || true

          echo "HTTP $code"
          cat /tmp/cron.json || true
          echo

          # A non-2xx is a real failure worth a red tick, since nothing else
          # is watching. The body is printed first so the run says why.
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            exit 1
          fi
        env:
          # A deployment URL is not a secret, and storing it as one means
          # GitHub masks it in the log, which makes exactly this kind of
          # problem harder to see. A repository variable is preferred; the
          # secret is still read so an existing setup keeps working.
          APP_URL: ${{ vars.APP_URL || secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
