# Test dynamic email: sends one sample email with a swap that opens when tapped
# and done / easy / hard buttons, to check they work in Gmail on her phone.
# Temporary. Uses the same two settings as the cron: APP_URL and CRON_SECRET.
name: Test dynamic email

on:
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Ask the app to send the test
        run: |
          url="${APP_URL%/}"
          case "$url" in
            https://*) ;;
            http://*) url="https://${url#http://}" ;;
            *) url="https://$url" ;;
          esac

          code=$(curl --silent --show-error --location --max-time 60 \
            --output /tmp/amp.json --write-out '%{http_code}' \
            --request POST \
            --header "authorization: Bearer $CRON_SECRET" \
            "$url/api/amp-test") || true

          echo "HTTP $code"
          cat /tmp/amp.json || true
          echo
          grep -q '"ok":true' /tmp/amp.json
        env:
          APP_URL: ${{ vars.APP_URL || secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
