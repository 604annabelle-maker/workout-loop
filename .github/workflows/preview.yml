# Preview the workout email: plans the next session as a booking would and
# sends it marked as a preview. Its log buttons work, but it never counts as
# training. Uses the same two settings as the cron: APP_URL and CRON_SECRET.
name: Preview the workout email

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Which app: 2 is the rebuild, 1 the old one"
        default: "2"
        type: choice
        options: ["2", "1"]

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Ask the app for a preview
        run: |
          url="${APP_URL%/}"
          case "$url" in
            https://*) ;;
            http://*) url="https://${url#http://}" ;;
            *) url="https://$url" ;;
          esac

          code=$(curl --silent --show-error --location --max-time 300 \
            --output /tmp/preview.json --write-out '%{http_code}' \
            --request POST \
            --header "authorization: Bearer $CRON_SECRET" \
            "$url/api/preview?version=${VERSION}") || true

          echo "HTTP $code"
          cat /tmp/preview.json || true
          echo
          grep -q '"ok":true' /tmp/preview.json
        env:
          APP_URL: ${{ vars.APP_URL || secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          VERSION: ${{ inputs.version || '2' }}
